spring.config.import=file:.env[.properties],file:.env[.properties]

spring.application.name=charfinder
server.port=8080
spring.profiles.active=local


security.jwt.refreshTtlSeconds=604800
security.jwt.accessTtlSeconds=900

# Gemini Configuration (using OpenAI-compatible endpoint)
spring.ai.openai.api-key=${GEMINI_API_KEY}
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}
gemini.api.completions.path=/chat/completions
gemini.model.name=gemini-2.5-flash